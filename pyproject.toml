[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-hype-audit"
version = "0.1.0"
description = "A local tool for identifying rhetorical signals in AI-related text."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Hype Audit Contributors" }]
dependencies = []

[project.scripts]
ai-hype-audit = "aihype.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
